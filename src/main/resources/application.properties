# Server Configuration
server.port=8080
server.servlet.context-path=/

# Google Gemini Configuration
gemini.api.base-url=https://generativelanguage.googleapis.com/v1beta
gemini.api.model.recipe=${GEMINI_MODEL_RECIPE:gemini-3.6-flash}
gemini.api.model.tips=${GEMINI_MODEL_TIPS:gemini-3.6-flash}
gemini.api.model.validation=${GEMINI_MODEL_VALIDATION:gemini-3.6-flash}
gemini.api.model.vision=${GEMINI_MODEL_VISION:gemini-3.6-flash}
gemini.api.default-key=${GEMINI_API_KEY:${OPENAI_API_KEY:}}
app.default-key.max-recipes-per-session=${APP_DEFAULT_KEY_MAX_RECIPES:20}
app.trial.cookie-enabled=true
app.asset-version=2.5.0
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Security Configuration
# Set APP_ENCRYPTION_KEY in .env (min 32 chars). Dev profile supplies a local-only default.
app.encryption.key=${APP_ENCRYPTION_KEY:}

# Session Configuration
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Use APP_SESSION_COOKIE_SECURE (not SERVER_SSL_ENABLED — that name enables Tomcat SSL via Spring Boot binding).
server.servlet.session.cookie.secure=${APP_SESSION_COOKIE_SECURE:false}

# Comma-separated origins for CORS (set to your Railway URL in production)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:8080}

# Logging (override in application-dev.properties or application-prod.properties)
logging.level.com.recipeassistant=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN

# Jackson Configuration
spring.jackson.default-property-inclusion=non_null

# Rate Limiting
app.rate-limit.requests-per-minute=15

# Request size limits
server.tomcat.max-http-form-post-size=10MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# Flyway schema migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
