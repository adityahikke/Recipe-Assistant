spring.profiles.active=test
app.encryption.key=test-encryption-key-for-unit-tests-32c
spring.jpa.show-sql=false

# These are fallback defaults. When Testcontainers is available,
# AbstractIntegrationTest overrides them via @DynamicPropertySource.
# When Docker is NOT available (e.g. Railway build), the tests are
# skipped via assumeTrue(), so these values are never actually used.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/recipe_assistant}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:recipe_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:recipe_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Hibernate should not try to auto-create/validate schema in tests
# (Flyway handles it, and integration tests use Testcontainers)
spring.jpa.hibernate.ddl-auto=none
